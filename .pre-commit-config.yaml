# Local hooks delegating to ruff from dev-dependencies (version pinned in uv.lock,
# identical to CI), plus Conventional Commits validation of the commit message.
# One-time setup per clone installs both hook types (see default_install_hook_types):
#   uv run pre-commit install
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]
  # Enforce Conventional Commits (https://www.conventionalcommits.org/) so every
  # commit message maps to a parser in cliff.toml. Allowed types mirror cliff.toml.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, perf, refactor, docs, test, ci, chore, style, revert]
