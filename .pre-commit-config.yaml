# Local hooks delegating to tools from dev-dependencies (versions pinned in
# uv.lock, identical to CI): ruff plus Conventional Commits validation.
# One-time setup per clone installs both hook types (see default_install_hook_types):
#   uv run pre-commit install
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]
      # Enforce Conventional Commits (https://www.conventionalcommits.org/) so every
      # commit message maps to a parser in cliff.toml. Allowed types mirror cliff.toml.
      - id: conventional-pre-commit
        name: conventional commit
        entry: uv run conventional-pre-commit
        language: system
        stages: [commit-msg]
        args: [feat, fix, perf, refactor, docs, test, ci, chore, style, revert]
