# Local hooks delegating to ruff from dev-dependencies (version pinned in uv.lock,
# identical to CI). One-time setup per clone:
#   uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]
