name: CI

on:
  push:
    branches: [main]
  pull_request:

# Anuluj przestarzały run, gdy ten sam PR/branch dostanie nowy push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # dorny/test-reporter tworzy Check Run z wynikami testów (adnotacje + summary).
  checks: write

jobs:
  tests:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies (uv.lock)
        run: uv sync --locked

      - name: Run test suite
        run: uv run pytest -v --junitxml=junit/test-results.xml

      # dorny/test-reporter parsuje JUnit XML i publikuje natywny Check Run:
      # adnotacje przy nieudanych testach oraz sekcję z wynikami w Summary.
      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: JUnit Tests Results
          path: junit/test-results.xml
          reporter: python-xunit

      # Surowy JUnit XML jako artefakt do pobrania (debugging).
      - name: Upload test results (JUnit)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-pytest
          path: junit/test-results.xml

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies (uv.lock)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .
