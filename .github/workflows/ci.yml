name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reused by .github/workflows/release.yml so the release gate runs the
  # exact same tests + ruff as regular CI.
  workflow_call:

# Cancel the outdated run when the same PR/branch receives a new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # dorny/test-reporter creates a Check Run with test results (annotations + summary).
  checks: write

jobs:
  tests:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies (uv.lock)
        run: uv sync --locked

      - name: Run test suite
        run: uv run pytest -v --junitxml=junit/test-results.xml

      # dorny/test-reporter parses JUnit XML and publishes a native Check Run:
      # annotations on failed tests and a results section in the Summary.
      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: JUnit Tests Results
          path: junit/test-results.xml
          reporter: python-xunit

      # Raw JUnit XML as a downloadable artifact (debugging).
      - name: Upload test results (JUnit)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-pytest
          path: junit/test-results.xml

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies (uv.lock)
        run: uv sync --locked

      # The 'github' format emits workflow commands (::error file=...,line=...),
      # which GitHub renders as inline annotations in the run view
      - name: Ruff lint (annotations)
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      # Lint summary in the job summary (equivalent to the Tests section):
      # ✅ when there are no findings, otherwise a per-rule statistics table
      - name: Write lint summary
        if: ${{ always() }}
        run: |
          {
            echo "### Ruff lint"
            if stats=$(uv run ruff check --statistics .); then
              echo "✅ 0 findings"
            else
              echo '```'
              echo "$stats"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
