[project]
name = "autoinstall-helper"
version = "0.1.0"
description = "Narzędzie do zarządzania konfiguracją autoinstall i nośnikami instalacyjnymi Ubuntu."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
autoinstall-helper = "autoinstall_helper.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
]
