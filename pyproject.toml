[project]
name = "autoinstall-helper"
version = "0.1.0"
description = "Tool for managing autoinstall configuration and Ubuntu installation media."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
autoinstall-helper = "autoinstall_helper.cli:main"
build-pyz = "autoinstall_helper.build:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "conventional-pre-commit>=4.5.0",
    "pre-commit>=4.0.0",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
# Test tiers:
# - unit (tests/test_*.py): default run, boundaries mocked at point of use
# - replay (tests/replay/): component tests that replay committed recordings
# - smoke (tests/smoke/): end-to-end tests against the built .pyz artifact
# Both replay and smoke are excluded from the default run; execute them with
# `uv run pytest -m replay` and `uv run pytest -m smoke` respectively.
markers = [
    "smoke: end-to-end tests against the built .pyz artifact (require Docker and network)",
    "replay: component tests that replay tests/replay/fixtures/*.recording.json",
]
addopts = "-m 'not smoke and not replay'"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# BLE001 (blind-except): deliberate pattern in CLI entry points (friendly error
# message + exit code 1) and in the Snap Store API network fallback.
ignore = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
# Validation script executed inside the container:
# - N999: the hyphenated filename is intentional (referenced by the Dockerfile),
# - EXE001: shebang executed inside the container, not on the host,
# - ASYNC221: blocking subprocess.run in a single asyncio.run() is harmless.
"src/autoinstall_helper/docker/validate-autoinstall.py" = ["N999", "EXE001", "ASYNC221"]
