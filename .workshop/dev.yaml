name: dev
base: ubuntu@24.04
sdks:
  - name: docker-ce
    channel: latest/stable
  - name: uv
    channel: latest/stable
  - name: agy
    channel: latest/stable
  - name: opencode
    channel: 2/stable
    plugs:
      git-config:
        interface: mount
        workshop-target: /home/workshop/.config/git
        read-only: true
      ssh-agent:
        interface: ssh-agent

actions:
  opencode: opencode "$@"
  agy: agy --dangerously-skip-permissions "$@"
